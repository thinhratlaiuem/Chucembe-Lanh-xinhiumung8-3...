<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chúc mừng 8/3</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
text-align:center;
color:white;
background:black;
}

video{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
min-width:100%;
min-height:100%;
z-index:-2;
filter:brightness(0.6);
}

.overlay{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

h1{
font-size:42px;
}

h2{
font-weight:normal;
}

button{
padding:15px 35px;
font-size:18px;
margin:10px;
border:none;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

#a{
background:pink;
color:white;
}

#a:hover{
transform:scale(1.1);
}

#b{
background:black;
color:white;
position:absolute;
}

.sound{
position:fixed;
bottom:20px;
right:20px;
padding:10px 20px;
background:white;
color:black;
border-radius:10px;
cursor:pointer;
}

.heart{
position:fixed;
top:-10px;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}

.fire{
position:fixed;
font-size:40px;
animation:boom 1s ease-out forwards;
pointer-events:none;
}

@keyframes boom{
0%{transform:scale(0);}
50%{transform:scale(2);}
100%{transform:scale(3);opacity:0;}
}

</style>
</head>

<body>

<video id="bgvideo" autoplay loop muted playsinline>
<source src="Cucvangcucbac.mp4" type="video/mp4">
</video>

<div class="overlay">

<h1>🌸 Chúc mừng 8/3 🌸</h1>
<h2>Ở bên Thịnh từ 8/3 này đến tất cả 8/3 sau nhé 💖</h2>

<button id="a" onclick="yes()">💖 Em đồng ý</button>
<button id="b">😼 Không đâu</button>

</div>

<div class="sound" onclick="sound()">🔊 Bật tiếng</div>

<script>

function sound(){
let v=document.getElementById("bgvideo");
v.muted=false;
v.play();
}

function yes(){

alert("Anh biết mà 😆💖");

for(let i=0;i<40;i++){

let f=document.createElement("div");

let icons=["🎆","✨","💥","🎇"];

f.innerHTML=icons[Math.floor(Math.random()*icons.length)];

f.className="fire";

f.style.left=Math.random()*100+"vw";

f.style.top=Math.random()*100+"vh";

document.body.appendChild(f);

setTimeout(()=>{f.remove()},1000);

}

}

let b=document.getElementById("b");

b.addEventListener("mouseover",move);

b.addEventListener("click",move);

function move(){

let x=Math.random()*(window.innerWidth-100);

let y=Math.random()*(window.innerHeight-50);

b.style.left=x+"px";

b.style.top=y+"px";

}

function heart(){

let h=document.createElement("div");

h.innerHTML="❤️";

h.className="heart";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(3+Math.random()*5)+"s";

h.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(h);

setTimeout(()=>{h.remove()},8000);

}

setInterval(heart,300);

</script>

</body>
</html>
